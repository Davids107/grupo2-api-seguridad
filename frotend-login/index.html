<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio sesion</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="signup-container">
    <!-- Columna Izquierda: Formulario -->
    <div class="left-panel">
      <!-- icono-->
      <div class="brand">
       <!-- <i class="fa-solid fa-cube logo-icon"></i> -->
        <span class="brand-name">...</span>
      </div>

      <!-- Formulario Central -->
      <div class="form-wrapper">
        <span class="subtitle">Bienvenido</span>
        <h1>Inicio de Sesion</h1>

        <form action="#">
          <!-- Input usuario con Outlined Label -->
          <div class="floating-input-group">
            <input type="text" id="correo" placeholder=" " required />
            <label for="correo">Usuario</label>
            <i class="fa-regular fa-user icon"></i>
          </div>

          <!-- Input Password con Outlined Label -->
          <div class="floating-input-group">
            <input type="password" id="password" placeholder=" " required />
            <label for="password">Contraseña</label>
            <i class="fa-regular fa-eye icon"></i>
          </div>

          <!-- Botón de Registro -->
          <button type="submit" class="btn-primary">Iniciar sesion</button>
        </form>

        <!-- Divisor con Texto -->
        <div class="divider">
        <label class="checkbox-container">
          <input type="checkbox" checked>
          <span class="checkmark"></span>
          Recordarme?
        </label>
        </div>
        
      </div>

      <!-- Pie de página -->
      <div class="footer-link">
         <a href="#">Olvido su contraseña?</a>
      </div>
    </div>

    <!-- Columna Derecha: Imagen  -->
    <div class="right-panel">
      <div class="slider-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </div>
  </div>

  <script>
  document.querySelector("form").addEventListener("submit", async function(e) {
    e.preventDefault(); // evita que la página se recargue

    const correo = document.getElementById("correo").value;
    const password = document.getElementById("password").value;

    const respuesta = await fetch("http://127.0.0.1:8000/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ correo: correo, password: password })
    });

    const datos = await respuesta.json();

    if (datos.codigo === 200) {
      alert("Bienvenido " + datos.usuario);
    } else {
      alert(datos.mensaje);
    }
  });
</script>

</body>
</html>
